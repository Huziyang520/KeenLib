plugins {
    id 'multiloader-common'
    id 'net.fabricmc.fabric-loom'
}

sourceSets.main.java.setSrcDirs([rootProject.file('../../common/src/main/java'),
                                 rootProject.file('../../fabric/src/main/java')])
sourceSets.main.resources.setSrcDirs([rootProject.file('../../common/src/main/resources'),
                                      rootProject.file('../../fabric/src/main/resources')])

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    compileOnly(files(rootProject.file('../../libs/fcap/forgeconfigapiport-fabric-26.3.1.jar')))
}

def camelotJar = rootProject.file('../../libs/camelot-fabric-26.3.jar')

// Nested jars are added by hand: Loom's include rejects a plain file dependency.
if (camelotJar.exists()) {
    tasks.named('jar') {
        from(camelotJar) {
            into 'META-INF/jars'
            rename { 'camelot.jar' }
        }
    }
    tasks.named('processResources') {
        doLast {
            def target = destinationDir.toPath().resolve('fabric.mod.json').toFile()
            if (target.exists()) {
                def json = new groovy.json.JsonSlurper().parse(target)
                json.jars = [[file: 'META-INF/jars/camelot.jar']]
                target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
            }
        }
    }
}

loom {
    def aw = rootProject.file('../../common/src/main/resources/keenlib.accesswidener')
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.matching { it.name == variant }.configureEach {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
