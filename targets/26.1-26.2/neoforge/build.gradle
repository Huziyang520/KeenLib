plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

sourceSets.main.java.setSrcDirs([rootProject.file('../../common/src/main/java'),
                                 rootProject.file('../../neoforge/src/main/java')])
sourceSets.main.resources.setSrcDirs([rootProject.file('../../common/src/main/resources'),
                                      rootProject.file('../../neoforge/src/main/resources')])

dependencies {
    compileOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}") { transitive = false }
}

def camelotJar = rootProject.file('../../libs/camelot-neoforge-26.1-26.2.jar')

// Nested jars are added by hand: jarJar rejects a plain file dependency that has no module name.
if (camelotJar.exists()) {
    tasks.named('jar') {
        from(camelotJar) {
            into 'META-INF/jarjar'
            rename { 'camelot.jar' }
        }
    }
    tasks.named('processResources') {
        doLast {
            def metadata = destinationDir.toPath().resolve('META-INF/jarjar/metadata.json').toFile()
            metadata.parentFile.mkdirs()
            metadata.text = '''{"jars":[{"identifier":{"group":"com.camelot","artifact":"camelot-neoforge-26.1-26.2"},"version":{"range":"[1.0.0,)","artifactVersion":"1.0.0"},"path":"META-INF/jarjar/camelot.jar","isObfuscated":false}]}'''
        }
    }
}

neoForge {
    version = neoforge_version
    def at = rootProject.file('../../common/src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransforms.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.matching { it.name == variant }.configureEach {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
